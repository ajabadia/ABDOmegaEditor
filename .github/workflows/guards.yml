name: Guards de la suite

# Los guards de la raiz (tools/auditar_*.mjs) NO se ejecutan solos: descubren
# los repos hermanos buscando directorios `.git` en el arbol de trabajo, asi que
# en un runner de GitHub, donde solo esta el repo raiz, no habria nada que
# mirar. Este workflow clona la suite primero.
#
# Que los guards corran aqui tiene una consecuencia que hay que tener presente:
# en CI todos los repos estan limpios, porque no hay trabajo sin commitear. Eso
# hace que el numero de "no auditables" sea 0 siempre, y por lo tanto que el
# tope de `auditar_eol` no se pueda validar aqui. El tope protege el trabajo en
# curso de otros hilos, que es cosa de la maquina de desarrollo, no del runner.
# Lo que CI protege es el INDICE, que si es lo que viaja entre maquinas.

on:
  push:
    # `main` es la rama por defecto del repo y es donde acaba cayendo el
    # trabajo de la gente. Un guard que solo corre en `workspace-history` no
    # protege nada de lo que pasa mientras tanto: se puede romper `main` sin
    # que se entere.
    branches: [main, workspace-history]
  pull_request:
    branches: [main, workspace-history]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: Los cuatro guards de la raiz
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout de la raiz
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ───────────────────────────────────────────────────────────────────
      # POR QUE CLONAR A MANO Y NO CON UN MATRIX
      #
      # Un matrix de un job por repo parallelismela, y seria lo natural. Pero
      # los guards no son "uno por repo": el de EOL tiene suelos que son sobre
      # la SUITE entera (mas de trece mil ficheros, mas de diez repos), asi
      # que un job que mira un solo repo no puede validar nada. Y el informe
      # que interesa es el agregado: "la suite esta limpia", no "ABDEep esta
      # limpio", que es lo que ya dice el push que lo ha causado.
      #
      # El coste de clonar los trece en un solo job es de unos treinta
      # segundos: con `--depth 1` solo baja el arbol actual, y los guards solo
      # necesitan el indice, que es exactamente lo que da un clon superficial.
      #
      # La lista es explicita y no se deduce, porque deduce exigiria que el
      # runner resolviera nombres, y un repo que alguien renombre en GitHub
      # dejaria de protegerse en silencio. Con la lista a mano, el fallo es un
      # 404 ruidoso en el log.
      #
      # Se clonan las ramas POR DEFECTO de cada repo, no las locales de
      # desarrollo: en CI no existe una rama de trabajo, y auditar la rama por
      # defecto es lo que dice el contrato. Si un repo esta en una rama de
      # desarrollo con trabajo sin auditar, eso lo ve el guard de la maquina,
      # no este.
      - name: Clonar la suite
        run: |
          set -euo pipefail
          fallos=0

          clonar() {
            local destino="$1" url="$2"

            # Si el destino ya existe NO se intenta clonar y se avisa, en vez de
            # dejar que `git clone` falle con un mensaje que no dice cual de las
            # lineas del script fue. Paso por un repo clonado dos veces con dos
            # nombres de destino distintos: el segundo `git clone` falla con
            # "destination path already exists", que es un error de git y no una
            # explicacion de lo que pasa. Aqui se dice el destino y la url.
            if [ -e "$destino" ]; then
              echo "  YA EXISTE  $destino  — no se clona (¿linea duplicada?)"
              fallos=$((fallos + 1))
              return
            fi

            # `--no-single-branch` es lo que hace que este guard mire mas de una rama.
            # Sin el, un clon baja el ARBOL de la rama por defecto y nada mas: ABDJUNiO601
            # tiene nueve ramas y se auditaba una, sin decir cual.
            #
            # Y `--depth 1` SE QUITA DE LA LISTA DE LO QUE HAY QUE ARREGLAR, con dato. Un
            # clon sin historia pesa entre 23 y 99 MB por repo, y los tres guards usan
            # `ls-files`, `grep`, `diff`, `check-attr` y `cat-file`: ninguno de los cinco
            # toca el historial, asi que la historia no les quita nada. Ramas todas,
            # historia ninguna, que es lo que sale mas barato por puerta cerrada.
            if git clone --depth 1 --no-single-branch --quiet "$url" "$destino" 2>&1; then
              echo "  ok  $destino"
            else
              echo "  FALLO  $destino  ($url)"
              fallos=$((fallos + 1))
            fi
          }

          echo "Clonando la suite ABDSynths:"
          clonar ABDAudioLab        https://github.com/ajabadia/ABDAudioLab.git
          clonar ABDBankManager     https://github.com/ajabadia/ABDBankManager.git
          clonar ABDCZ101           https://github.com/ajabadia/ABDCZ101.git
          clonar ABDEep             https://github.com/ajabadia/ABDEep.git
          clonar ABDJUNiO601        https://github.com/ajabadia/ABDJUNiO601.git
          clonar ABDMS2000          https://github.com/ajabadia/ABDMS2000.git
          clonar ABDNeural          https://github.com/ajabadia/ABDNeural.git
          clonar ABDOmegaUnified    https://github.com/ajabadia/ABDOmegaUnified.git
          clonar ABDScope           https://github.com/ajabadia/ABDScope.git
          clonar ABDSharedAssets    https://github.com/ajabadia/ABDSharedAssets.git
          clonar ABDSharedCode      https://github.com/ajabadia/ABDSharedCode.git
          # Estos tres viven en subdirectorios en la maquina de desarrollo, y
          # por eso no salen si se clonan en la raiz. OJO con el nombre del
          # DIRECTORIO, que no es el del repo: el repo se llama `ABDSynthWeb` y
          # el directorio se llama `ABDSynthsWeb/abd-ia_synths`. Clonarlo donde
          # toca en el arbol es lo que hace que el guard lo encuentre como lo
          # que es, un subrepo, y no lo que es en GitHub.
          clonar ABDSynthsWeb/abd-ia_synths   https://github.com/ajabadia/ABDSynthWeb.git
          clonar _specific_example           https://github.com/specific-dev/examples.git

          # ABDOmega no se clona, y es a proposito. Esta deprecado: lo que hay es
          # `ABDOmegaUnified`, la fusion de los tres proyectos que eran. Clonarlo
          # cuesta 3.177 ficheros que nadie mantiene, y mientras estuviera en la
          # lista de `REPOS_OBLIGATORIOS` el runner gastaba el tiempo de todos los
          # guards en algo que ya no se vigila.

          if [ "$fallos" -ne 0 ]; then
            echo
            echo "::error::No se pudieron clonar $fallos repo(s) de la suite."
            echo "Un repo que no se clona es un repo que no se audita, y eso es"
            echo "peor que no tener guard: el informe sale verde sin haber mirado."
            exit 1
          fi

          echo
          echo "Repos clonados: $(find . -mindepth 2 -maxdepth 3 -name .git -type d | wc -l)"

      # El `.gitattributes` de la raiz pone `* text=auto eol=lf`, asi que un
      # clon en el runner deja los ficheros en LF, que es lo que el guard quiere
      # ver. No hay que forzar nada: el filtro de git ya normaliza al checkout.
      #
      # Y aqui esta la razon de que el guard tenga una sola linea de reglas y no
      # mas: los `.gitattributes` de los repos hermanos NO heredan de este, cada
      # uno tiene el suyo, y es el que gobierna. Anadir reglas aqui para "fijar"
      # el comportamiento de los hermanos no tendria efecto ninguno.
      # `--caja-sensible` mide con la semantica de Linux aunque el guard se este
      # ejecutando en una maquina con el sistema de ficheros que no distingue caja.
      # En ESTE runner es un no-op, porque aqui `core.ignorecase` ya es `false` y no
      # hay nada que forzar. Lo que compra es que el numero que sale signifique lo
      # mismo en todas partes: la linea base es un unico numero por repo, y si dos
      # maquinas lo miden distinto no se puede comparar ni se puede bajar.
      #
      # Y no es teoria, ya ha pasado: ABDCZ101 tiene la regla `*.syx` y 194
      # ficheros `.SYX`, de modo que en Windows son 314 tapados y en Linux 120. Sin
      # este flag, un Windows da 314 y este runner da 120, y el guard lo anuncia
      # como una mejora que no es.
      # ESTE PASO VA PRIMERO DE LOS TRES GUARDS, Y POR QUE.
      #
      # Los otros tres preguntan por el CONTENIDO de la suite: si un fichero
      # incumple la regla que declara, si una regla de ignore tapa trabajo ya
      # trackeado, si una regla de eol explica su CR. Los tres son verdes con una
      # suite a la que le han desaparecido tres repos, porque ninguno de los tres
      # mira cuantos hay. Este es el que mira cuantos hay.
      #
      # No es una hipotesis. Los repos de aqui son clones, y un clon puede fallar,
      # un repo se puede renombrar, y un `.gitignore` de la raiz puede dejar de
      # descubrir un hermano sin que nadie se entere. Todo eso baja el numero de
      # ficheros, y una suite que encoge en silencio se audita mas rapido y mejor:
      # es la direccion en la que este trabajo es mas peligroso.
      #
      # Va antes que los otros por una razon muy concreta: un guard de contenido
      # sobre una suite encogida no avisa de nada, porque lo que encuentra en una
      # suite a la que le falta un repo es un subconjunto de lo que habia. Ponerlo
      # primero convierte "el guard ha pasado" en una afirmacion sobre la suite
      # entera y no sobre el trozo que se ha podido bajar.
      #
      # Y va DESPUES del paso de clon, que es donde se sabe que estan los trece
      # repos. Antes de ese paso solo existe la raiz, que en esta rama son trece
      # ficheros, y el suelo global lo pondria en rojo siempre.
      #
      # Los suelos son el MENOR de los dos entornos, medido con este mismo codigo:
      # 14 repos y 8.336 ficheros en el clon de las ramas por defecto, y 14 y
      # 13.647 en la maquina de desarrollo, que trabaja en ramas de desarrollo y
      # por eso ve mas. Un suelo medido solo aqui haria fallar a este runner en
      # cada push, que es el error que ya se cometio una vez con el suelo de
      # ficheros auditados del guard de EOL.
      - name: Auditar el tamano de la suite (que no se haya encogido)
        run: node tools/auditar_tamano.mjs

      # Ademas de la rama desplegada, este guard mira TODAS las ramas de cada repo.
      # No es por afan de mirar mas: ABDJUNiO601 tiene 3.951 ficheros trackeados y
      # tapados en `feature/fidelity-certified` y NINGUNO en `main`, porque el
      # `.gitignore` que los tapa es el de la rama. Sin esto, el runner media 0 y
      # la maquina 3.951, y el techo de la linea base era un numero que ningun
      # entorno habia medido nunca. Cuesta unos quince segundos mas.
      - name: Auditar .gitignore (ficheros trackeados tapados)
        run: node tools/auditar_ignore_oculto.mjs --caja-sensible

      - name: Auditar EOL (nadie incumple la regla que declara)
        run: node tools/auditar_eol.mjs

      - name: Auditar justificacion de eol=crlf
        run: node tools/auditar_justificacion_crlf.mjs

      # Los tests de los guards no se ejecutaban en ningun sitio automatico.
      # Un guard con los tests rotos sigue dando verde en CI mientras sus
      # tests no corran, y eso es el peor fallo que puede tener un guard: el
      # que parece vigilando y no vigila.
      #
      # Va despues de clonar porque hay bloques que auditan la suite real, y en
      # el runner esa suite solo existe despues del clon. Adelante fallarian
      # por el motivo equivocado.
      #
      # Un solo paso para los seis ficheros: `node --test` sale con codigo
      # distinto de cero si alguno falla, que es lo que pone el paso en rojo.
      #
      # Y la lista es explicita a proposito: un `tools/*.test.mjs` traeria de mas
      # cualquier fichero a medio escribir, que es justo cuando el paso no deberia
      # ponerse rojo. El coste de acordarse de anadir aqui el fichero nuevo es
      # uno; el de que un test se quede sin correr es que nadie se entere.
      #
      # El de tamano va el primero por el mismo motivo que su guard: su bloque
      # de suite real necesita la suite clonada, y el resto tambien.
      #
      # `guards_main.test.mjs` va el ultimo porque NO necesita la suite clonada: monta
      # la suya propia, en miniatura y con git de verdad, para ejecutar los guards
      # como proceso hijo y mirar su codigo de salida. Va el ultimo porque es el
      # que mas tarda, y si el paso se pone rojo antes no hace falta llegar a el.
      - name: Tests de los guards
        run: |
          node --test \
            tools/auditar_tamano.test.mjs \
            tools/auditar_ignore_oculto.test.mjs \
            tools/auditar_eol.test.mjs \
            tools/auditar_justificacion_crlf.test.mjs \
            tools/margenes.test.mjs \
            tools/guards_main.test.mjs
